<header class="p-3 w-full fixed top-0 z-50 bg-linear-to-r from-primary to-black">

    <div class="flex align-middle items-center px-10   text-white mx-auto gap-6">

        <a routerLink="/" class="flex items-center gap-3 max-h-16  border-r-white border-r-2 pr-6"
            routerLinkActive="text-accent" [routerLinkActiveOptions]="{ exact: true }">

            <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-6">

                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4.5 6.375a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM14.25 8.625a4.125 4.125 0 1 1 8.25 0 4.125 4.125 0 0 1-8.25 0ZM2.25 19.125a7.5 7.5 0 0 1 15 0v.375a.75.75 0 0 1-.75.75H3a.75.75 0 0 1-.75-.75v-.375Z" />

            </svg>

            <h3 class="text-2xl font-semibold uppercase">
                Dating app
            </h3>

        </a>

        <nav class="flex gap-3 my-2 uppercase text-lg text-white">

            @if(accountService.currentUser())
            {

            <a routerLink="/members" routerLinkActive="text-accent"
                [routerLinkActiveOptions]="{ exact: true }">Matches</a>
            <a routerLink="/lists" routerLinkActive="text-accent" [routerLinkActiveOptions]="{ exact: true }">Lists</a>
            <a routerLink="/messages" routerLinkActive="text-accent"
                [routerLinkActiveOptions]="{ exact: true }">Messages</a>


            }
            <a routerLink="/errors" routerLinkActive="text-accent"
                [routerLinkActiveOptions]="{ exact: true }">Errors</a>
        </nav>

        <div class="flex items-center ml-auto gap-3">

            <div class="dropdown dropdown-end mr-5">
                <button tabindex="1" class="flex flex-col justify-center items-center text-white cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6 flex self-center">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M9.53 16.122a3 3 0 0 0-5.78 1.128 3 3 0 0 1-2.4 2.245 4.5 4.5 0 0 0 8.4-2.245c0-.399-.078-.78-.22-1.128Zm0 0a15.998 15.998 0 0 0 3.388-1.62m-5.043-.025a15.994 15.994 0 0 1 1.622-3.395m3.42 3.42a15.995 15.995 0 0 0 4.764-4.648l3.876-5.814a1.151 1.151 0 0 0-1.597-1.597L14.146 6.32a15.996 15.996 0 0 0-4.649 4.763m3.42 3.42a6.776 6.776 0 0 0-3.42-3.42" />
                    </svg>

                    <span class="text-xs uppercase">
                        {{ selectedTheme() }}
                    </span>
                </button>

                <ul tabindex="1" class="dropdown-content menu bg-base-100  text-base-content rounded-box z-50 mt-2 w-52 p-2 shadow-sm">
                    @for (theme of themes; track theme) {
                    <li>
                        <a (click)="handleSelectTheme(theme)">
                            {{ theme }}
                        </a>
                    </li>
                    }
                </ul>
            </div>

            @if(accountService.currentUser(); as user)
            {
            <div class="dropdown  dropdown-end">
                <div tabindex="0" role="button" class="flex items-center text-white text-xl  gap-3 cursor-pointer">
                    <!-- <img src="user.image_URL || '/user.png'" alt="user avatar" class="w-8 h-8 rounded-full" /> -->

                    <img [src]="user.image_URL || '/user.png'" alt="user avatar"
                        class="w-10 h-10 rounded-full object-cover" />

                    <span>{{user.displayName}}</span>
                </div>
                <ul tabindex="-1" class="dropdown-content text-base-content   menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm">
                    <li><a>Edit Profile</a></li>
                    <li><a (click)="logout()">Logout</a></li>
                </ul>
            </div>

            }
            @else
            {
            <form class="flex items-center gap-3" #loginForm="ngForm" (ngSubmit)="login()">

                <input type="text" class="input text-black" placeholder="Email" [(ngModel)]="creds.email" name="email">

                <input type="password" class="input text-black" placeholder="Password" [(ngModel)]="creds.password"
                    name="password">

                <button type="submit" class="btn">
                    Login
                </button>

            </form>

            }



        </div>

    </div>

</header>
