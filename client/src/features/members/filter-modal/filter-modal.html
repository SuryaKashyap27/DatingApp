
<dialog #filterModal class="modal">
    <div class="modal-box">
        <h3 class="text-lg font-bold">Select Filters</h3>

        <div class="flex flex-col gap-4 py-4">

            <!-- Gender Filter -->
            <div class="flex items-center gap-4">
                <label class="font-semibold">Gender:</label>

                <div class="filter">
                    <input
                        type="reset"
                        value="x"
                        class="btn btn-square"
                        aria-label="Reset gender"
                        (click)="memberParams.update(p => ({ ...p, gender: undefined }))"
                    />

                    <input
                        type="radio"
                        class="btn"
                        [ngModel]="memberParams().gender"
                        (ngModelChange)="memberParams.update(p => ({ ...p, gender: $event }))"
                        name="gender"
                        value="male"
                        aria-label="Male"
                    />

                    <input
                        type="radio"
                        class="btn"
                        [ngModel]="memberParams().gender"
                        (ngModelChange)="memberParams.update(p => ({ ...p, gender: $event }))"
                        name="gender"
                        value="female"
                        aria-label="Female"
                    />
                </div>
            </div>

            <!-- Age Filter -->
            <div class="flex items-center gap-4">
                <label class="font-semibold">Age:</label>

                <div class="flex items-center gap-2">
                    <input
                        type="number"
                        class="input w-20"
                        min="18"
                        [ngModel]="memberParams().minAge"
                        (ngModelChange)="memberParams.update(p => ({ ...p, minAge: $event }))"
                        name="minAge"
                        (change)="onMinAgeChange()"
                    />

                    <span>to</span>

                    <input
                        type="number"
                        class="input w-20"
                        [min]="memberParams().minAge"
                        [ngModel]="memberParams().maxAge"
                        (ngModelChange)="memberParams.update(p => ({ ...p, maxAge: $event }))"
                        name="maxAge"
                        (change)="onMaxAgeChange()"
                    />
                </div>
            </div>

            <!-- Sorting Filter -->
            <label class="flex justify-between items-center">
                <span class="font-semibold">Order by:</span>

                <select
                    class="select"
                    name="orderBy"
                    [ngModel]="memberParams().orderBy"
                    (ngModelChange)="memberParams.update(p => ({ ...p, orderBy: $event }))"
                >
                    <option disabled value="">Order by</option>
                    <option value="created">Newest members</option>
                    <option value="lastActive">Last active</option>
                </select>
            </label>

        </div>

        <!-- Submit Button -->
        <button
            type="button"
            class="btn btn-primary"
            (click)="submit()"
        >
            Submit
        </button>
    </div>

    <!-- Modal Backdrop -->
    <form method="dialog" class="modal-backdrop">
        <button name="close">Close</button>
    </form>
</dialog>
