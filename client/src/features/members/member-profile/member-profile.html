@if (memberService.member(); as member) {
<div class="flex flex-col gap-3">

  <div class="flex gap-3">
    <span class="font-semibold">Member since:</span>
    <span>{{ member.created | date: 'longDate' }}</span>
  </div>


  <div class="flex gap-3">
    <span class="font-semibold">Last active:</span>
    <span>{{ member.lastActive | timeAgo }}</span>
  </div>

  <h3 class="text font-semibold text-primary">
    About {{ member.displayName }}
  </h3>

@if (memberService.editMode()) {
  <form
    #editForm="ngForm"
    (ngSubmit)="updateProfile()"
    class="flex flex-col w-full gap-4">

    <!-- Display Name -->
    <label class="floating-label">
      <span>Display name</span>
      <input
        name="displayName"
        [(ngModel)]="editableMember.displayName"
        placeholder="Display name"
        class="input w-full" />
    </label>

    <!-- Description -->
    <label class="floating-label">
      <span>Description</span>
      <textarea
        name="description"
        [(ngModel)]="editableMember.description"
        placeholder="Description"
        class="textarea w-full"></textarea>
    </label>

    <!-- City -->
    <label class="floating-label">
      <span>City</span>
      <input
        name="city"
        [(ngModel)]="editableMember.city"
        placeholder="City"
        class="input w-full" />
    </label>

    <!-- Country -->
    <label class="floating-label">
      <span>Country</span>
      <input
        name="country"
        [(ngModel)]="editableMember.country"
        placeholder="Country"
        class="input w-full" />
    </label>

    <!-- Submit Button -->
    <div class="flex self-end">
      <button  [disabled]="!editForm.dirty" type="submit" class="btn btn-success">
        Submit
      </button>
    </div>

  </form>
} @else {
  <div>{{ member.description }}</div>
}


</div>
}
